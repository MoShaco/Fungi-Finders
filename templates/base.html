<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
    {% block script %}{% endblock %}

    <title>{% block title %}{% endblock %}</title>
  </head>
  <body>
    <a class="skip-to-main" href="#main">Skip to main content</a>
    <header class="site-header">
      <div class="wrapper" data-type="wide">
        <div class="site-header__inner">
          <a href="/">
            <img
              src="{{ url_for('static', filename="../static/assets/imgs/fungi-finders.svg") }}"
              alt="Logo"
            />
          </a>
          <button aria-controls="primary-nav" aria-expanded="false">
            <img src="../static/assets/imgs/hamburger.svg" alt="" />
          </button>
          <nav id="primary-nav" class="primary-navigation">
            <ul role="list">
              <li><a href="/">Discover</a></li>
              <li><a href="/mushroom-guide">Mushroom Guide</a></li>
              <li><a href="/mushroom-guide#faq">FAQ</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <main id="main">{% block content %}{% endblock %}</main>
    <footer class="site-footer">
      <p class="site-footer__title">Happy Foraging!</p>
      <a href="mailto:contact@fungifinders.com">contact@fungifinders.com</a>
    </footer>
  </body>
</html>
